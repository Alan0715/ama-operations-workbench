<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>值班日志详细校验看板</title>
  <style>
    :root{--bg:#f5efe6;--card:#fffdf8;--ink:#302820;--muted:#776b5f;--line:#e3d7c6;--brand:#805035;--ok:#397348;--bad:#b33b33;--warn:#b87621}*{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:12px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{padding:0 18px 28px;max-width:1240px;margin:auto}
    .brand-head{width:100vw;margin:0 calc(50% - 50vw) 10px;padding:18px max(18px,calc((100vw - 1204px)/2)) 15px;background:linear-gradient(110deg,#f6efdf,#ead8b9);border-bottom:3px solid #c7a15e;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand-name{font:700 28px/1.15 "Songti SC",serif;letter-spacing:3px;color:#33271f}.brand-sub{margin-top:6px;color:#9a7e66;font-size:11px;letter-spacing:.6px}.head-pills{display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap}.head-pill{min-width:78px;padding:7px 10px;border:1px solid #d8bda0;border-radius:18px;background:rgba(207,170,124,.17);text-align:center;color:#604b3d}.head-pill.alert{background:rgba(179,59,51,.08);border-color:#dfb8ae}.head-pill b{display:block;color:#a7563e;font-size:21px;line-height:1}.head-pill span{display:block;margin-top:4px;font-weight:700;font-size:11px}
    .data-head{display:flex;justify-content:space-between;gap:14px;align-items:end;margin-bottom:10px}h1{font:700 18px/1.2 "Songti SC",serif;margin:0;color:#4b2f22}.meta{color:var(--muted);font-size:10px;text-align:right}
    .filters{display:flex;flex-wrap:wrap;gap:8px;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}.filters label{display:block;font-size:9px;color:var(--muted);margin-bottom:2px}.filters select{min-width:110px;border:1px solid var(--line);border-radius:7px;background:#fff;padding:5px 8px;color:var(--ink);font-size:11px}.count{margin-left:auto;color:var(--muted);padding:5px}
    .table-wrap{overflow-y:auto;overflow-x:hidden;background:var(--card);border:1px solid var(--line);border-radius:10px;max-height:calc(100vh - 185px)}table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left;overflow-wrap:anywhere;word-break:break-word}th{position:sticky;top:0;z-index:2;background:#eee3d3;color:#4c3a2d;font-size:10px;line-height:1.3;white-space:normal;text-align:center}th:nth-child(1){width:8%}th:nth-child(2){width:12%}th:nth-child(3){width:19%}th:nth-child(4){width:8%}th:nth-child(5){width:12%}th:nth-child(6),th:nth-child(7){width:13%}th:nth-child(8){width:15%}.store{font-weight:700}.muted{color:var(--muted)}.badge{display:inline-block;padding:1px 6px;border-radius:10px;font-weight:700;white-space:nowrap}.ok{background:#e5f0e7;color:var(--ok)}.bad{background:#fae5e2;color:var(--bad)}.warn{background:#f8ead5;color:var(--warn)}
    .photos{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;width:100%;min-width:0}.photos img{width:min(38px,42%);height:48px;object-fit:cover;border:1px solid var(--line);border-radius:5px;cursor:zoom-in;background:#eee}.bad-text{color:var(--bad);font-weight:650;white-space:normal}.none{color:#aaa}.empty{text-align:center;padding:30px;color:var(--muted)}
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.84);display:none;align-items:center;justify-content:center;z-index:20;padding:24px}.lightbox.show{display:flex}.lightbox img{max-width:94vw;max-height:92vh;border-radius:8px}.lightbox span{position:absolute;right:18px;top:10px;color:#fff;font-size:26px;cursor:pointer}
    @media(max-width:700px){.wrap{padding:0 5px 20px}.brand-head{margin:0 calc(50% - 50vw) 9px;padding:13px 8px;align-items:flex-start}.brand-name{font-size:22px}.head-pills{gap:5px;max-width:285px}.head-pill{min-width:82px;padding:6px}.head-pill b{font-size:17px}.data-head{display:block}.meta{text-align:left;margin-top:3px}.table-wrap{max-height:calc(100vh - 260px)}table{font-size:9px}th,td{padding:5px 2px}.photos{gap:2px}.photos img{width:min(28px,46%);height:36px}.badge{padding:1px 3px;font-size:9px}}
  </style>
</head>
<body><main class="wrap">
  <header class="brand-head"><div><div class="brand-name">阿嬷手作</div><div class="brand-sub" id="brandSub">值班日志校验看板 · 正在同步</div></div><div class="head-pills"><div class="head-pill"><b id="expected">—</b><span>应检门店</span></div><div class="head-pill"><b id="submitted">—</b><span>已提交</span></div><div class="head-pill alert"><b id="missing">—</b><span>未提交</span></div><div class="head-pill alert"><b id="anomaly">—</b><span>异常疑似</span></div><div class="head-pill alert"><b id="duplicate">—</b><span>重复图片</span></div></div></header>
  <div class="data-head"><h1>值班日志详细校验看板</h1><div class="meta" id="meta">正在自动同步最新业务日数据…</div></div>
  <section class="filters">
    <div><label>业务日期</label><select id="fDate"></select></div><div><label>门店</label><select id="fStore"></select></div><div><label>提交状态</label><select id="fStatus"><option value="">全部</option><option value="正常">正常</option><option value="异常疑似">异常疑似</option><option value="未提交">未提交</option></select></div><div><label>重复图片</label><select id="fDuplicate"><option value="">全部</option><option value="是">是</option><option value="否">否</option></select></div><span class="count" id="count"></span>
  </section>
  <div class="table-wrap"><table><thead><tr><th>业务日期</th><th>门店</th><th>照片异常说明</th><th>提交人</th><th>提交时间</th><th>效期表照片</th><th>每日报数照片</th><th>本周营运公告返图</th></tr></thead><tbody id="tbody"></tbody></table></div>
</main><div class="lightbox" id="lightbox"><span>×</span><img alt="照片预览"></div>
<script src="data/duty-data.js"></script>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let payload=null,payloads=[],rows=[];
const fmtTime=ms=>ms?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(ms)):'—';
function datesBack(days=45){const out=[],d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-1);for(let i=0;i<days;i++){out.push(d.toLocaleDateString('en-CA',{timeZone:'Asia/Shanghai'}));d.setDate(d.getDate()-1)}return out}
async function loadLatest(){if(window.DUTY_DATA?.business_date)return window.DUTY_DATA;for(const date of datesBack()){try{const r=await fetch(`./data/${date}.json`,{cache:'no-store'});if(r.ok){const data=await r.json();if(data.business_date===date)return data}}catch(e){}}throw new Error('最近45天未发现已同步的值班日志校验数据')}
function optionize(el,values,label){el.innerHTML=`<option value="">${label}</option>`+values.map(v=>`<option>${esc(v)}</option>`).join('')}
function photos(list,label){return list?.length?`<div class="photos">${list.map((src,i)=>`<img src="${esc(src)}" loading="lazy" alt="${label}${i+1}" data-preview="${esc(src)}">`).join('')}</div>`:'<span class="none">无</span>'}
function duplicateText(item){const matches=item?.matches||[];const where=[...new Map(matches.map(x=>[`${x.date||'日期未知'}|${x.store||'门店未知'}`,x])).values()].map(x=>`${x.date||'日期未知'}（${x.store||'门店未知'}）`);return where.length?`${item.reason||'照片内容完全一致'}；与 ${where.join('、')} 相同`:(item?.reason||'')}
const REGION_ORDER=['华南一区','华南二区','华南三区','华南四区','华南五区','华南六区','华南七区','华南八区','华南九区'];
const STORE_REGION={"深圳仁恒梦中心店":"华南一区","深圳ONE AVENUE卓悦中心店":"华南一区","深圳金光华店":"华南一区","深圳万象食家店":"华南一区","深圳天安云谷店":"华南一区","深圳布吉万象汇店":"华南二区","深圳平安金融中心店":"华南二区","深圳kkone店":"华南二区","深圳梅林卓悦汇店":"华南二区","深圳万象前海店":"华南三区","深圳欢乐港湾店":"华南三区","深圳宝安大仟里店":"华南三区","深圳万象天地店·茶歇":"华南四区","深圳科兴科学园店":"华南四区","深圳来福士广场店":"华南四区","深圳海上世界店":"华南四区","深圳湾万象城店":"华南四区","广州太古汇店":"华南五区","广州天环广场店":"华南五区","广州塔广场店":"华南五区","广州天汇广场店":"华南五区","广州万象城店·集":"华南五区","佛山岭南天地店":"华南六区","广州永庆坊店·茶肆":"华南六区","东莞汇一城店":"华南六区","广州乐峰广场店":"华南六区","东莞记忆店·茶肆":"华南六区","厦门万象城店":"华南七区","厦门SM新生活广场店·集":"华南八区","深圳宝安壹方城店":"华南八区","深圳怀德万象汇店":"华南八区","深圳腾讯总部园区店":"华南八区","珠海富华里店":"华南九区","顺德万象汇店":"华南九区","珠海万象汇店":"华南九区","佛山万象天地店":"华南九区"};
function regionRank(region){const i=REGION_ORDER.indexOf(region);return i<0?REGION_ORDER.length:i}
function normalize(data){const missing=new Map((data.audit?.missing_stores||[]).map(x=>[x.store,x]));const anomaly=new Map((data.audit?.suspected_anomalies||[]).map(x=>[x.store,x]));const duplicateMap=new Map((data.audit?.duplicate_images||[]).map(x=>[x.store,x]));const records=(data.records||[]).map(r=>{const reason=[anomaly.get(r.store)?.reason,duplicateText(duplicateMap.get(r.store))].filter(Boolean);return {...r,date:r.business_date||data.business_date,region:STORE_REGION[r.store]||'未分区',weekly_operation_images:r.weekly_operation_images||[],status:reason.length?'异常疑似':'正常',duplicate:duplicateMap.has(r.store)?'是':'否',anomaly_reason:reason.join('；')}});for(const [store,item] of missing)records.push({date:data.business_date,store,region:STORE_REGION[store]||'未分区',creator:'—',create_time:null,expiry_images:[],daily_report_images:[],weekly_operation_images:[],status:'未提交',duplicate:'否',anomaly_reason:item.reason||'未找到该业务日值班日志'});return records}
function render(){const fd=$('fDate').value,fs=$('fStore').value,fst=$('fStatus').value,dup=$('fDuplicate').value;payload=payloads.find(x=>x.business_date===fd)||payloads[0];const dayRows=rows.filter(r=>r.date===payload.business_date),reportCount=payload.record_count??dayRows.filter(x=>x.status!=='未提交').length,anomalyCount=payload.audit?.suspected_anomaly_count??dayRows.filter(x=>x.status==='异常疑似').length,duplicateCount=payload.audit?.duplicate_image_store_count??dayRows.filter(x=>x.duplicate==='是').length;$('brandSub').textContent=`值班日志校验看板 · ${payload.business_date}`;$('meta').textContent=`业务日期 ${payload.business_date}｜自动同步 ${payload.synced_at||'—'}｜${payload.audit?.date_rule||'按日志内业务日期归属'}`;$('expected').textContent=payload.expected_store_count??dayRows.length;$('submitted').textContent=reportCount;$('missing').textContent=payload.audit?.missing_log_count??dayRows.filter(x=>x.status==='未提交').length;$('anomaly').textContent=anomalyCount;$('duplicate').textContent=duplicateCount;const view=dayRows.filter(r=>(!fs||r.store===fs)&&(!fst||r.status===fst)&&(!dup||r.duplicate===dup)).sort((a,b)=>regionRank(a.region)-regionRank(b.region)||String(a.store).localeCompare(String(b.store),'zh-CN'));$('count').textContent=`显示 ${view.length} 条 / 当日共 ${dayRows.length} 条`;$('tbody').innerHTML=view.map(r=>`<tr><td>${esc(r.date)}</td><td class="store">${esc(r.store)}</td><td class="${r.anomaly_reason?'bad-text':'muted'}">${esc(r.anomaly_reason||'—')}</td><td>${esc(r.creator)}</td><td class="muted">${fmtTime(r.create_time)}</td><td>${photos(r.expiry_images,'效期表照片')}</td><td>${photos(r.daily_report_images,'每日报数照片')}</td><td>${photos(r.weekly_operation_images,'本周营运公告返图')}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">当前筛选无记录</td></tr>'}
async function init(){try{payloads=(Array.isArray(window.DUTY_HISTORY)&&window.DUTY_HISTORY.length?window.DUTY_HISTORY:[await loadLatest()]).filter(x=>String(x.business_date)>='2026-08-13').sort((a,b)=>String(b.business_date).localeCompare(String(a.business_date)));payload=payloads[0];rows=payloads.flatMap(normalize);$('fDate').innerHTML=payloads.map(x=>`<option value="${esc(x.business_date)}">${esc(x.business_date)}</option>`).join('');$('fDate').value=payload.business_date;optionize($('fStore'),[...new Set(rows.map(x=>x.store))].sort((a,b)=>regionRank(STORE_REGION[a])-regionRank(STORE_REGION[b])||String(a).localeCompare(String(b),'zh-CN')),'全部门店');document.querySelectorAll('select').forEach(x=>x.addEventListener('change',render));render()}catch(e){$('meta').textContent=e.message;$('tbody').innerHTML=`<tr><td colspan="8" class="empty">${esc(e.message)}</td></tr>`}}
document.addEventListener('click',e=>{const src=e.target?.dataset?.preview;if(src){$('lightbox').querySelector('img').src=src;$('lightbox').classList.add('show')}else if(e.target.closest('#lightbox')){$('lightbox').classList.remove('show')}});init();
</script></body></html>
