<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6f2f25">
  <title>华南营运综合看板</title>
  <style>
    :root{--bg:#f4eee4;--paper:#fffdf8;--ink:#342720;--muted:#85766d;--line:#e5d8c7;--brand:#74352b;--brand2:#a85d45;--gold:#c5a061;--green:#667746;--red:#a8443a;--shadow:0 14px 42px rgba(91,61,40,.12)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}button,a{font:inherit}
    .shell{min-height:100vh;display:grid;grid-template-columns:208px minmax(0,1fr)}
    aside{position:sticky;top:0;height:100vh;padding:18px 13px;background:linear-gradient(165deg,#45221d 0%,#74352b 58%,#92503b 100%);color:#fff;display:flex;flex-direction:column;box-shadow:8px 0 28px rgba(60,30,20,.13);z-index:3}
    .logo{padding:2px 7px 18px}.logo strong{font-family:"Songti SC",serif;font-size:18px;letter-spacing:1px}.logo small{display:block;margin-top:5px;color:#ead8cd;font-size:9px;letter-spacing:.8px}
    .nav{display:grid;gap:7px}.nav button{border:1px solid transparent;border-radius:11px;background:transparent;color:#f3e8df;text-align:left;padding:10px 9px;cursor:pointer;display:grid;grid-template-columns:27px 1fr;gap:8px;align-items:center;transition:.2s}.nav button:hover{background:rgba(255,255,255,.08)}.nav button.active{background:#fffaf1;color:var(--brand);box-shadow:0 8px 24px rgba(41,20,14,.18)}.nav .ico{font-size:17px}.nav b{font-size:12px}.nav small{display:block;margin-top:2px;font-size:9px;opacity:.72}
    .aside-foot{margin-top:auto;padding:12px 7px 0;border-top:1px solid rgba(255,255,255,.16);font-size:9px;color:#e4cec2;line-height:1.6}
    main{min-width:0;padding:16px}.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:12px}.eyebrow{color:var(--brand2);font-weight:800;font-size:9px;letter-spacing:1.4px}.topbar h1{font-family:"Songti SC",serif;margin:4px 0 3px;font-size:24px;letter-spacing:.5px}.topbar p{margin:0;color:var(--muted);font-size:11px}.date{color:var(--muted);font-size:10px;white-space:nowrap}
    .overview{display:none}.overview.active{display:block}.hero{padding:21px;border-radius:16px;color:#fff;background:linear-gradient(125deg,#5d2b25,#8b4937 68%,#b27a50);box-shadow:var(--shadow)}.hero h2{margin:0 0 7px;font-family:"Songti SC",serif;font-size:22px}.hero p{margin:0;color:#f1ddd1;font-size:11px}
    .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:16px;box-shadow:0 8px 26px rgba(91,61,40,.08);cursor:pointer;transition:.2s}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.card-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.card-icon{width:37px;height:37px;border-radius:11px;display:grid;place-items:center;background:#f2e5d6;font-size:19px}.badge{border-radius:999px;padding:4px 7px;background:#f3eee6;color:var(--muted);font-size:9px}.card h3{font-size:14px;margin:13px 0 3px}.biz-date{color:var(--muted);font-size:10px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:13px}.metric{padding:9px;border-radius:10px;background:#f7f2ea}.metric strong{display:block;font-size:19px;color:var(--brand)}.metric span{font-size:9px;color:var(--muted)}.card-link{margin-top:13px;color:var(--brand2);font-size:10px;font-weight:700}.source-note{margin-top:12px;color:var(--muted);font-size:9px;line-height:1.6}
    .workspace{display:none;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.workspace.active{display:block}.work-head{min-height:51px;padding:8px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.work-title{display:flex;align-items:center;gap:9px}.work-icon{width:31px;height:31px;border-radius:9px;background:#f1e6d8;display:grid;place-items:center;font-size:16px}.work-title b{display:block;font-size:13px}.work-title small{color:var(--muted);font-size:9px}.open{color:var(--brand);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:9px}.stage{height:calc(100vh - 112px);min-height:620px;background:#eee7dc}.stage iframe{width:100%;height:100%;border:0;background:#fff}
    .loading{color:var(--muted);font-size:10px}.warn{color:var(--red)!important}
    @media(max-width:900px){.cards{grid-template-columns:1fr}.shell{grid-template-columns:176px minmax(0,1fr)}}
    @media(max-width:680px){.shell{display:block}aside{position:relative;height:auto;padding:13px}.logo{padding-bottom:11px}.nav{grid-template-columns:repeat(4,1fr)}.nav button{grid-template-columns:1fr;text-align:center;padding:9px 2px}.nav b{font-size:10px}.nav small,.aside-foot{display:none}main{padding:10px}.topbar{display:block}.date{display:none}.topbar h1{font-size:22px}.hero{padding:17px}.stage{height:76vh;min-height:500px}}
  </style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="logo"><strong>营运综合看板</strong><small>SOUTH CHINA OPERATIONS</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="aside-foot">两个看板统一入口<br>业务日期按各源数据内部定义展示</div>
  </aside>
  <main>
    <header class="topbar"><div><div class="eyebrow">AMA HANDCRAFTED · SOUTH CHINA</div><h1>华南营运综合看板</h1><p>统一查看风险与品控数据。</p></div><div class="date" id="today"></div></header>
    <section class="overview active" id="overview">
      <div class="hero"><h2>今日营运总览</h2><p>每张卡片独立标注业务日期，避免将更新时间误当业务日期。</p></div>
      <div class="cards" id="cards"><div class="loading">正在读取看板的最新数据…</div></div>
      <div class="source-note">数据来源：品控稽核报告明细。「合计」与空值按子看板原规则处理。</div>
    </section>
    <section class="workspace" id="workspace">
      <div class="work-head"><div class="work-title"><span class="work-icon" id="workIcon"></span><div><b id="workName"></b><small id="workDesc"></small></div></div><a class="open" id="openLink" target="_blank" rel="noopener">新窗口打开</a></div>
      <div class="stage"><iframe id="frame" title="业务看板"></iframe></div>
    </section>
  </main>
</div>
<script>
const modules=[
 {id:'overview',icon:'◉',name:'综合总览',short:'总览',desc:'四项业务关键指标'},
 {id:'risk',icon:'◈',name:'效期·报损联合看板',short:'风险联看',desc:'效期异常与报损结构',local:'expiry-loss-dashboard/index.html'},
 {id:'qc',icon:'✓',name:'品控稽核看板',short:'品控稽核',desc:'稽核报告、问题点与红线',local:'qc-dashboard-2026-09/index.html'}
];
const nav=document.getElementById('nav'),overview=document.getElementById('overview'),workspace=document.getElementById('workspace'),frame=document.getElementById('frame');
nav.innerHTML=modules.map(m=>`<button data-id="${m.id}"><span class="ico">${m.icon}</span><span><b>${m.short}</b><small>${m.desc}</small></span></button>`).join('');
function select(id){const m=modules.find(x=>x.id===id)||modules[0];document.querySelectorAll('[data-id]').forEach(x=>x.classList.toggle('active',x.dataset.id===m.id));const isOverview=m.id==='overview';overview.classList.toggle('active',isOverview);workspace.classList.toggle('active',!isOverview);if(!isOverview){document.getElementById('workIcon').textContent=m.icon;document.getElementById('workName').textContent=m.name;document.getElementById('workDesc').textContent=m.desc;document.getElementById('openLink').href=m.local;if(frame.getAttribute('src')!==m.local)frame.src=m.local;}history.replaceState(null,'','#'+m.id)}
document.querySelectorAll('[data-id]').forEach(el=>el.addEventListener('click',()=>select(el.dataset.id)));
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(m,date,metrics,badge){return `<article class="card" data-card="${m.id}"><div class="card-head"><span class="card-icon">${m.icon}</span><span class="badge">${esc(badge)}</span></div><h3>${m.name}</h3><div class="biz-date">业务日期：${esc(date)}</div><div class="metrics">${metrics.map(x=>`<div class="metric"><strong class="${x.warn?'warn':''}">${esc(x.value)}</strong><span>${esc(x.label)}</span></div>`).join('')}</div><div class="card-link">进入看板 →</div></article>`}
async function loadOverview(){try{const qc=await fetch('qc-dashboard-2026-09/data/qc-data.json',{cache:'no-store'}).then(r=>r.json());const q=modules.find(x=>x.id==='qc');document.getElementById('cards').innerHTML=card(q,qc.target,[{value:qc.stats.reports,label:'稽核报告'},{value:qc.stats.issues,label:'问题点',warn:qc.stats.issues>0},{value:qc.stats.redline,label:'红线问题',warn:qc.stats.redline>0},{value:`${qc.stats.offline_reports}/${qc.stats.online_reports}`,label:'线下 / 线上'}],`累计 ${qc.start} 至 ${qc.target}`);document.querySelectorAll('[data-card]').forEach(el=>el.addEventListener('click',()=>select(el.dataset.card)))}catch(e){document.getElementById('cards').innerHTML='<div class="card"><h3>总览数据暂未载入</h3><div class="biz-date">请通过左侧菜单直接进入各子看板。</div></div>'}}
document.getElementById('today').textContent=new Intl.DateTimeFormat('zh-CN',{dateStyle:'full'}).format(new Date());select(location.hash.slice(1)||'overview');loadOverview();
</script>
</body>
</html>
