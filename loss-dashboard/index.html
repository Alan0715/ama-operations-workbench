<body>
<header class="top"><div class="wrap"><div class="brand">华南大区<small id="period">报损原因数据看板</small></div><div class="stat-pills" id="headerPills"></div></div></header>
<main class="wrap">
  <div class="kpis" id="kpis"></div>
  <section class="module-shell blue-shell">
  <div class="section-h">报损原因金额结构</div>
  <div class="grid"><section class="panel"><div class="panel-h"><span>原因金额及当日占比</span><small>分母：当日全部参考金额</small></div><div id="reasonBars"></div></section><section class="panel"><div class="panel-h"><span>区域报损金额结构</span><small>按组织架构</small></div><div id="regionBars"></div></section></div>
  </section>
  <section class="module-shell amber-shell">
  <div class="section-h">报损金额 TOP10 物料与未报损门店</div>
  <div class="filter-box"><div class="filters">
    <div><label>物料区域</label><select id="tRegion"><option value="">全部区域</option></select></div>
    <div><label>物料门店</label><select id="tStore"><option value="">全部门店</option></select></div>
    <button class="reset" id="tReset">重置物料筛选</button><span class="cnt" id="tCount"></span>
  </div></div>
  <div class="material-grid"><section class="panel"><div class="panel-h"><span>报损金额 TOP10 物料</span><small>按参考金额降序</small></div><div class="top-materials" id="topMaterials"></div></section><section class="panel"><div class="panel-h"><span>📌 未报损门店播报</span><small>按组织架构核对</small></div><div class="broadcast-body" id="noLossBroadcast"></div></section></div>
  </section>
  <section class="module-shell blue-shell scroll-shell">
  <div class="section-h">门店报损占比与营收</div>
  <div class="target-standard"><div class="standard-title">考核指标标准 · 按税后日营业额区间匹配目标报损占比<small>税后营业额＝营业额（含服务费）÷ 1.06</small></div><div class="standard-grid" id="targetStandard"></div><div class="formula-note">报损实际占比＝当日门店报损总金额 ÷ 税后营业额；达标率＝报损目标 ÷ 报损实际占比。实际占比高于目标的门店以红色标识，无报损门店的达标率显示“无报损”。</div></div>
  <div class="filter-box"><div class="filters">
    <div><label>营收区域</label><select id="rRegion"><option value="">全部区域</option></select></div>
    <div><label>营收门店</label><select id="rStore"><option value="">全部门店</option></select></div>
    <button class="reset" id="rReset">重置营收筛选</button><span class="cnt" id="rCount"></span>
  </div></div>
  <div class="module-scroll" id="revenueBlocks"></div>
  </section>
  <section class="module-shell amber-shell scroll-shell">
  <div class="section-h">门店 × 报损原因金额矩阵</div>
  <div class="filter-box"><div class="filters">
    <div><label>矩阵区域</label><select id="mRegion"><option value="">全部区域</option></select></div>
    <div><label>矩阵门店</label><select id="mStore"><option value="">全部门店</option></select></div>
    <div><label>矩阵报损原因</label><select id="mReason"><option value="">全部原因</option></select></div>
    <button class="reset" id="mReset">重置矩阵筛选</button><span class="cnt" id="mCount"></span>
  </div></div>
  <div class="module-scroll" id="matrixBlocks"></div>
  </section>
  <section class="module-shell blue-shell scroll-shell">
  <div class="section-h">区域—门店报损原因汇总明细</div>
  <div class="filter-box"><div class="filters">
    <div><label>明细区域</label><select id="dRegion"><option value="">全部区域</option></select></div>
    <div><label>明细门店</label><select id="dStore"><option value="">全部门店</option></select></div>
    <div><label>明细报损原因</label><select id="dReason"><option value="">全部原因</option></select></div>
    <button class="reset" id="dReset">重置明细筛选</button><span class="cnt" id="dCount"></span>
  </div></div>
  <div class="module-scroll" id="detailBlocks"></div>
  </section>
  <div class="foot" id="foot"></div>
</main>
<script src="data/loss-data.js"></script>
<script>
const DATA=window.LOSS_DATA,all=DATA.rows,orgStores=DATA.organizationStores||[],revenueRows=DATA.revenueRows||[],dayTotal=all.reduce((s,r)=>s+(r.amount||0),0),money=n=>new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY'}).format(n),matrixMoney=n=>n?`¥${new Intl.NumberFormat('zh-CN',{maximumFractionDigits:2,minimumFractionDigits:2}).format(n)}`:'—',pct=n=>(n*100).toFixed(2)+'%',regionOrder=new Map(['华南一区','华南二区','华南三区','华南四区','华南五区','华南六区','华南七区','华南八区','华南九区','未匹配区域'].map((x,i)=>[x,i]));
const targetBands=[{max:10000,label:'＜ 10,000',rate:.0209},{max:16667,label:'10,000–16,667',rate:.0184},{max:23333,label:'16,667–23,333',rate:.0122},{max:30000,label:'23,333–30,000',rate:.0098},{max:36667,label:'30,000–36,667',rate:.0089},{max:43333,label:'36,667–43,333',rate:.0080},{max:50000,label:'43,333–50,000',rate:.0075},{max:56667,label:'50,000–56,667',rate:.0072},{max:63333,label:'56,667–63,333',rate:.0071},{max:70000,label:'63,333–70,000',rate:.0065},{max:76667,label:'70,000–76,667',rate:.0060},{max:83333,label:'76,667–83,333',rate:.0060},{max:90000,label:'83,333–90,000',rate:.0060},{max:96667,label:'90,000–96,667',rate:.0060},{max:103333,label:'96,667–103,333',rate:.0060},{max:Infinity,label:'＞ 103,333',rate:.0060}],targetFor=n=>targetBands.find(x=>n<x.max)?.rate??.006;
const regionSort=(a,b)=>(regionOrder.get(a)??99)-(regionOrder.get(b)??99),textSort=(a,b)=>String(a).localeCompare(String(b),'zh-CN'),unique=(rows,key,sorter=textSort)=>[...new Set(rows.map(r=>r[key]))].filter(Boolean).sort(sorter);
function group(rows,keys){const map=new Map;rows.forEach(r=>{const id=keys.map(k=>r[k]).join('\u0001'),v=map.get(id)||{count:0,priced:0,amount:0,vals:keys.map(k=>r[k])};v.count++;if(r.amount!=null)v.priced++;v.amount+=r.amount||0;map.set(id,v)});return [...map.values()]}
function syncSelect(el,values,label,sorter=textSort){const selected=el.value,items=[...new Set(values)].filter(Boolean).sort(sorter);el.replaceChildren(new Option(label,''),...items.map(v=>new Option(v,v)));if(items.includes(selected))el.value=selected}
