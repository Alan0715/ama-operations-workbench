<style>

<body>
<header class="top"><div class="wrap"><div class="brand">华南大区<small id="period">报损原因数据看板</small></div><div class="stat-pills" id="headerPills"></div></div></header>
<main class="wrap">
  <div class="kpis" id="kpis"></div>
  <section class="module-shell blue-shell">
  <div class="section-h">报损原因金额结构</div>
  <div class="filter-box"><div class="filters">
    <div><label>结构区域</label><select id="oRegion"><option value="">全部区域</option></select></div>
    <div><label>结构门店</label><select id="oStore"><option value="">全部门店</option></select></div>
    <div><label>报损原因</label><select id="oReason"><option value="">全部原因</option></select></div>
    <button class="reset" id="oReset">重置结构筛选</button><span class="cnt" id="oCount"></span>
  </div></div>
  <div class="grid"><section class="panel"><div class="panel-h"><span>原因金额及占比</span></div><div id="reasonBars"></div></section><section class="panel"><div class="panel-h"><span>区域报损金额结构</span><small>按组织架构</small></div><div id="regionBars"></div></section></div>
  </section>
  <section class="module-shell amber-shell">
  <div class="section-h">区域 / 门店 PK 对比</div>
  <div class="filter-box"><div class="filters">
    <div><label>PK 日期</label><select id="pkDate"></select></div>
    <div><label>对比层级</label><select id="pkScope"><option value="region">区域 PK</option><option value="store">门店 PK</option></select></div>
    <div><label>对比对象 A</label><select id="pkA"></select></div>
    <div><label>对比对象 B</label><select id="pkB"></select></div>
    <button class="reset" id="pkReset">重置 PK</button><span class="cnt" id="pkCount"></span>
  </div></div>
  <div class="pk-grid" id="pkCompare"></div>
  </section>
  <section class="module-shell blue-shell">
  <div class="section-h">单店日期 PK 对比</div>
  <div class="filter-box"><div class="filters">
    <div><label>PK 门店</label><select id="sdStore"></select></div>
    <div><label>日期 A</label><select id="sdDateA"></select></div>
    <div><label>日期 B</label><select id="sdDateB"></select></div>
    <button class="reset" id="sdReset">重置日期 PK</button><span class="cnt" id="sdCount"></span>
  </div></div>
