<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>华南区｜营运四表完成情况看板</title>
<style>
:root{--cream:#fbf6ec;--paper:#fff;--ink:#3a2f28;--muted:#88796b;--line:#e7dccb;--red:#9e2b25;--red2:#c0453c;--green:#6f7d3f;--gold:#c9a66b;--shadow:0 6px 18px rgba(120,90,50,.10)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fbf6ec,#f3ead9);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:30px}.wrap{max-width:1240px;margin:auto;padding:0 18px}
header{padding:16px 4vw 0;margin-bottom:16px}.hero{max-width:1240px;margin:auto;padding:22px 36px 18px;border:1px solid rgba(201,166,107,.48);border-bottom:4px solid var(--gold);border-radius:28px;background:linear-gradient(120deg,#f5efe0,#ece0c8 55%,#ddc9a6 140%);box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}.brand{font-family:"Songti SC","STSong",serif;font-size:30px;font-weight:700;letter-spacing:3px}.brand small{display:block;font:400 13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;letter-spacing:1px;color:#7a5c3f;margin-top:4px}.pills{display:flex;gap:9px;flex-wrap:wrap}.pill{min-width:82px;text-align:center;padding:7px 13px;border:1px solid rgba(122,63,42,.18);background:rgba(122,63,42,.08);border-radius:20px;font-size:12px;color:#5a4632}.pill b{display:block;font-size:20px;color:#a85e3f}.section{font-family:"Songti SC","STSong",serif;font-size:18px;color:var(--red);border-left:5px solid var(--gold);padding-left:10px;margin:18px 0 10px}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}.filters label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}.filters select,.filters button{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;box-shadow:var(--shadow)}.filters button{background:var(--red);color:white;border:0;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.region-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);border-top:4px solid var(--gold)}.region-card h3{margin:0 0 10px;font-size:16px}.bar{height:9px;border-radius:8px;background:#eee5d8;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--green))}.region-meta{margin-top:9px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}.region-meta b{color:var(--red)}
.table-wrap{overflow:auto;max-height:640px;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;font-size:13px;min-width:1040px}th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:center;vertical-align:middle}th{position:sticky;top:0;z-index:3;background:#f3ead9;color:#4a312a;border-bottom:2px solid var(--gold);white-space:nowrap}.region-row td{background:#f3ead9;text-align:left;font-weight:700;color:#4a312a;border-top:2px solid var(--gold)}td.store{text-align:left;font-weight:700;white-space:nowrap}.status{display:inline-block;padding:3px 9px;border-radius:8px;font-size:12px;font-weight:700}.ok{background:#eaf0de;color:var(--green)}.miss{background:#f7e4e1;color:var(--red)}.multi{background:#f7eedd;color:#94631b}.missing-text{font-size:12px;color:var(--red);text-align:left;min-width:220px}.empty{text-align:center;padding:46px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:14px}.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:15px}@media(max-width:640px){header{padding:10px 10px 0}.hero{padding:18px 20px;border-radius:22px}.brand{font-size:23px}.pills{width:100%}.pill{flex:1}.wrap{padding:0 12px}}
</style></head><body>
<header><div class="hero"><div class="brand">华南区<small id="period">营运四表完成情况看板</small></div><div class="pills" id="pills"></div></div></header>
<main class="wrap"><div class="section">区域完成概览</div><div id="regionCards" class="cards"></div><div class="section">门店完成明细</div><div class="filters"><div><label>区域</label><select id="fRegion"></select></div><div><label>城市</label><select id="fCity"></select></div><div><label>完成状态</label><select id="fStatus"><option value="">全部状态</option><option value="complete">4表全部完成</option><option value="incomplete">存在缺失</option></select></div><button id="reset">重置</button></div><div id="content"></div><div class="foot" id="foot"></div></main>
<script src="data/form-data.js"></script><script>
const data=window.FORM_DASHBOARD_DATA||{};const templates=data.templates||[];const stores=data.stores||[];const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const period=document.querySelector('#period'),pills=document.querySelector('#pills'),cards=document.querySelector('#regionCards'),content=document.querySelector('#content'),foot=document.querySelector('#foot');const fRegion=document.querySelector('#fRegion'),fCity=document.querySelector('#fCity'),fStatus=document.querySelector('#fStatus');
period.textContent=`营运四表完成情况看板 · ${data.business_date||'等待首次同步'}`;const st=data.stats||{};pills.innerHTML=[['门店',st.stores||0],['全部完成',st.complete_stores||0],['存在缺失',st.incomplete_stores||0],['完成率',(st.completion_rate||0)+'%']].map(x=>`<div class="pill"><b>${x[1]}</b>${x[0]}</div>`).join('');
cards.innerHTML=(data.region_summary||[]).map(r=>`<article class="region-card"><h3>${esc(r.region)}</h3><div class="bar"><i style="width:${Number(r.completion_rate)||0}%"></i></div><div class="region-meta"><span>${r.completed_forms}/${r.expected_forms} 表</span><span><b>${r.incomplete_stores}</b> 家缺失</span><span>${r.completion_rate}%</span></div></article>`).join('')||'<div class="empty">等待首次同步真实业务数据</div>';
function options(el,label,values){el.innerHTML=`<option value="">全部${label}</option>`+[...new Set(values.filter(Boolean))].map(v=>`<option>${esc(v)}</option>`).join('')};options(fRegion,'区域',(data.region_order||[]));options(fCity,'城市',stores.map(x=>x.city));
function badge(s){const n=s?.report_count||0;return n>1?`<span class="status multi">已完成（${n}份）</span>`:n===1?'<span class="status ok">已完成</span>':'<span class="status miss">未完成</span>'}
function render(){let rows=stores.filter(r=>(!fRegion.value||r.region===fRegion.value)&&(!fCity.value||r.city===fCity.value)&&(!fStatus.value||(fStatus.value==='complete'?r.completed_count===templates.length:r.completed_count!==templates.length)));if(!rows.length){content.innerHTML='<div class="empty">没有符合条件的门店记录</div>';return}let last='';let html='<div class="table-wrap"><table><thead><tr><th>区域</th><th>城市</th><th>门店</th>'+templates.map(t=>`<th>${esc(t.short)}</th>`).join('')+'<th>完成数</th><th>完成率</th><th>缺失表单</th></tr></thead><tbody>';for(const r of rows){if(r.region!==last){html+=`<tr class="region-row"><td colspan="${7+templates.length}">${esc(r.region)}</td></tr>`;last=r.region}html+=`<tr><td>${esc(r.region)}</td><td>${esc(r.city)}</td><td class="store">${esc(r.store)}</td>${templates.map(t=>`<td>${badge(r.statuses?.[t.key])}</td>`).join('')}<td>${r.completed_count}/${templates.length}</td><td>${r.completion_rate}%</td><td class="missing-text">${(r.missing_forms||[]).map(x=>esc(x)).join('；')||'—'}</td></tr>`}content.innerHTML=html+'</tbody></table></div>'}for(const el of [fRegion,fCity,fStatus])el.addEventListener('change',render);document.querySelector('#reset').onclick=()=>{fRegion.value=fCity.value=fStatus.value='';render()};render();foot.textContent=data.updated_at?`数据更新：${data.updated_at}｜按区域、城市、门店排序`:'尚未同步数据｜不会使用旧日期数据代替';
</script></body></html>
